{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Treasurers - Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css"/>
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Poppins", sans-serif;
      background-color: #fff;
    }

    header a {
      text-decoration: none;
    }

    li {
      list-style: none;
    }

    .flex_space {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    button {
      border: none;
      background: none;
      transition: 0.5s;
      cursor: pointer;
    }

    .primary_btn {
      padding: 10px 20px;
      background: #1c5451;
      font-weight: bold;
      color: white;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      gap: 8px;
    }

    .primary_btn:hover {
      background-color: #12686e;
    }

    .welcome-message {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #1c5451;
      font-weight: bold;
      font-size: 15px;
      padding: 10px;
    }

    .welcome-message i {
      font-size: 24px;
      transition: transform 0.3s ease, color 0.3s ease;
    }

    .welcome-message:hover i {
      transform: scale(1.2);
      color: #12686e;
    }

    header {
      height: 90px;
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgb(179, 229, 216);
      box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.1);
    }

    header img {
      padding: 10px;
      width: 250px;
      height: 80px;
    }

    header ul {
      display: flex;
      align-items: center;
    }

    header ul li {
      margin: 0 10px;
      text-transform: uppercase;
    }

    header ul li a {
      color: grey;
      transition: 0.3s;
    }

    header ul li a:hover {
      color: #12686e;
    }

    header .navbar span {
      display: none;
    }

    @media only screen and (max-width: 768px) {
      header ul {
        position: absolute;
        top: 90px;
        left: 0;
        width: 100%;
        background: rgb(179, 229, 216);
        flex-direction: column;
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.5s;
        text-align: center;
        z-index: 9;
      }

      header ul li {
        margin: 15px 0;
      }

      header .navbar span {
        display: block;
        color: black;
        font-size: 25px;
        cursor: pointer;
        line-height: 90px;
      }
    }
      .edit-treasurer-container {
    max-width: 600px;
    margin: 40px auto;
    padding: 30px;
    background-color: #fdfdfd;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
  }

  .edit-treasurer-container h1 {
    font-size: 24px;
    color: #1c5451;
    margin-bottom: 30px;
    text-align: center;
  }

  .edit-form .form-group {
    margin-bottom: 20px;
  }

  .edit-form label {
    display: block;
    font-weight: 500;
    margin-bottom: 6px;
    color: #1c5451;
  }

  .edit-form input {
    width: 100%;
    padding: 10px;
    font-size: 14px;
    border: 1px solid #c4dad7;
    border-radius: 6px;
    background-color: #f9fdfd;
  }

  .form-submit {
    display: flex;
    justify-content: center;
    margin-top: 20px;
  }

  .form-submit button {
    padding: 12px 40px;
    font-size: 16px;
    font-weight: bold;
    background-color: #1c5451;
    color: white;
    border-radius: 6px;
    transition: background-color 0.3s ease, transform 0.2s ease;
    width: 550px;
    margin: 0 auto;
  }

  .form-submit button:hover {
    background-color: #12686e;
  }

  @media (max-width: 768px) {
    .edit-treasurer-container {
      padding: 20px;
    }

    .form-submit button {
      width: 100%;
    }
  }
  </style>
</head>
<body>
<header>
  <div class="content flex_space">
    <div class="logo">
      <img src="{% static 'Sadaqahlogo.png' %}" alt="SadaqahEase Logo"/>
    </div>
    <div class="navbar">
      <ul id="menulist">
        <li><a href="{% url 'admin_mainpage' %}">Home</a></li>
        <li><a href="{% url 'manage_donors' %}">Donors</a></li>
        <li><a href="{% url 'manage_treasurers' %}">Treasurer</a></li>
        <li><a href="">Campaigns</a></li>
        <li><a href="">Donation Dashboard</a></li>
        <li><a href="">Report</a></li>
        <li>
          <div class="welcome-message">
            <i class="fas fa-user-circle"></i>
            Welcome, {{ admin.name }}!
          </div>
        </li>
        <li>
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="primary_btn">
              <i class="fas fa-sign-out-alt"></i> Logout
            </button>
          </form>
        </li>
      </ul>
      <span class="fa fa-bars" onclick="menutoggle()"></span>
    </div>
  </div>
</header>

<script>
  function menutoggle() {
    const menu = document.getElementById("menulist");
    if (menu.style.maxHeight === "0px" || menu.style.maxHeight === "") {
      menu.style.maxHeight = "500px";
    } else {
      menu.style.maxHeight = "0px";
    }
  }

  window.onload = function () {
    if (window.innerWidth <= 768) {
      document.getElementById("menulist").style.maxHeight = "0px";
    }
  };
</script>
<main class="edit-treasurer-container">
  <h1>Edit Treasurer</h1>

  <form method="post" class="edit-form">
    {% csrf_token %}
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" value="{{ treasurer.name }}" required />
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ treasurer.email }}" required />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="text" id="password" name="password" value="{{ treasurer.password }}" required />
    </div>

    <div class="form-submit">
      <button type="submit" class="primary_btn">Save Changes</button>
    </div>
  </form>
</main>

</body>
</html>
